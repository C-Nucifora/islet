name: Islet
options:
  bundleIdPrefix: dev.nedlane
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: false
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Islet:
    type: application
    platform: macOS
    sources:
      - path: Islet
        excludes: ["Resources/**"]
      - path: Islet/Resources
        buildPhase: resources
    dependencies:
      - package: Defaults
      - framework: Vendor/MediaRemoteAdapter.framework
        embed: true
        codeSign: true
        link: false
    info:
      path: Islet/Info.plist
      properties:
        CFBundleDisplayName: Islet
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSCalendarsUsageDescription: "Islet shows your next event and today's agenda in the notch."
        NSCalendarsFullAccessUsageDescription: "Islet shows your next event and today's agenda in the notch."
        NSRemindersUsageDescription: "Islet shows your reminders in the notch and lets you complete them."
        NSRemindersFullAccessUsageDescription: "Islet shows your reminders in the notch and lets you complete them."
        NSBluetoothAlwaysUsageDescription: "Islet shows a brief animation when a Bluetooth device connects or disconnects, and reads the battery level of connected Apple peripherals."
        NSLocationWhenInUseUsageDescription: "Islet shows the name of the Wi-Fi network you join. macOS requires location access to read network names; deny this and Islet will simply say 'Wi-Fi connected'."
        NSLocalNetworkUsageDescription: "Islet connects to T3 Code on your Macs to show active agents in the notch."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  IsletTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: IsletTests
        excludes: ["Fixtures/**"]
      - path: IsletTests/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Islet
schemes:
  Islet:
    build:
      targets:
        Islet: all
        IsletTests: [test]
    test:
      targets: [IsletTests]
