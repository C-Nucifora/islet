name: Islet
options:
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Islet.xcconfig
  Release: Config/Islet.xcconfig
packages:
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # A stable signing identity, not ad-hoc. TCC keys every grant on the app's designated
    # requirement, and an ad-hoc signature's requirement is a bare cdhash that changes on every
    # build — so macOS treated each rebuild as a brand-new app and dropped Accessibility,
    # Calendar and Reminders every time. Signing with one certificate makes the requirement use
    # the configured bundle identifier and certificate root, which do not change between builds.
    # Create the certificate with Scripts/create-signing-certificate.sh.
    CODE_SIGN_IDENTITY: "$(ISLET_CODE_SIGN_IDENTITY)"
    CODE_SIGN_STYLE: Manual
    MACOSX_DEPLOYMENT_TARGET: "26.0"
  configs:
    Debug:
      ENABLE_HARDENED_RUNTIME: false
    Release:
      ENABLE_HARDENED_RUNTIME: true
targets:
  Islet:
    type: application
    platform: macOS
    sources:
      - path: Islet
        excludes: ["Resources/**"]
      - path: Islet/Resources
        buildPhase: resources
    dependencies:
      - package: Defaults
      - framework: Vendor/MediaRemoteAdapter.framework
        embed: true
        codeSign: true
        link: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(ISLET_PRODUCT_BUNDLE_IDENTIFIER)"
    info:
      path: Islet/Info.plist
      properties:
        CFBundleDisplayName: Islet
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSUIElement: true
        NSHumanReadableCopyright: ""
        NSCalendarsUsageDescription: "Islet shows your next event and today's agenda in the notch."
        NSCalendarsFullAccessUsageDescription: "Islet shows your next event and today's agenda in the notch."
        NSRemindersUsageDescription: "Islet shows your reminders in the notch and lets you complete them."
        NSRemindersFullAccessUsageDescription: "Islet shows your reminders in the notch and lets you complete them."
        NSBluetoothAlwaysUsageDescription: "Islet shows a brief animation when a Bluetooth device connects or disconnects, and reads the battery level of connected Apple peripherals."
        NSLocationWhenInUseUsageDescription: "Islet shows the name of the Wi-Fi network you join. macOS requires location access to read network names; deny this and Islet will simply say 'Wi-Fi connected'."
        NSLocalNetworkUsageDescription: "Islet connects to T3 Code on your Macs to show active agents in the notch."
        # Remote HTTP must be approved twice in a reviewed build. Add its exact origin here, then
        # add its host to NSExceptionDomains with NSExceptionAllowsInsecureHTTPLoads set to true.
        # Islet still asks the user to approve plain HTTP when they pair that exact origin.
        T3ApprovedInsecureHTTPOrigins: []
        NSAppTransportSecurity:
          # T3's local runtime uses loopback HTTP. Keep this exception local instead of disabling
          # ATS for every URLSession in the app.
          NSAllowsLocalNetworking: true
          # Keep this list empty unless a reviewed build deliberately supports one remote HTTP
          # host. T3TransportPolicy also requires an exact origin entry above, including its port.
          NSExceptionDomains: {}
  IsletTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: IsletTests
        excludes: ["Fixtures/**"]
      - path: IsletTests/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Islet
schemes:
  Islet:
    build:
      targets:
        Islet: all
        IsletTests: [test]
    test:
      targets: [IsletTests]
