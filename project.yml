name: Islet
options:
  bundleIdPrefix: dev.cnucifora
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  Defaults:
    url: https://github.com/sindresorhus/Defaults
    from: 9.0.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: false
    MACOSX_DEPLOYMENT_TARGET: "26.0"
targets:
  Islet:
    type: application
    platform: macOS
    sources:
      - path: Islet
        excludes: ["Resources/**"]
      - path: Islet/Resources
        buildPhase: resources
    dependencies:
      - package: Defaults
      - framework: Vendor/MediaRemoteAdapter.framework
        embed: true
        codeSign: true
        link: false
    info:
      path: Islet/Info.plist
      properties:
        CFBundleDisplayName: Islet
        LSUIElement: true
        NSHumanReadableCopyright: ""
  IsletTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: IsletTests
        excludes: ["Fixtures/**"]
      - path: IsletTests/Fixtures
        buildPhase: resources
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Islet
schemes:
  Islet:
    build:
      targets:
        Islet: all
        IsletTests: [test]
    test:
      targets: [IsletTests]
