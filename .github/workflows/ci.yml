name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-arm64:
    name: Build, test, and analyze (arm64)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DERIVED_DATA: ${{ github.workspace }}/DerivedData

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: |
          Scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Restore verified xcbeautify archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xcbeautify-cache
          key: xcbeautify-3.2.1-universal-87fdbe786f71d7b2ee28c5c1ca97087587292f2c5c6f9e721cf02db8b2a3c241

      - name: Install xcbeautify
        run: |
          Scripts/install-xcbeautify.sh "$RUNNER_TEMP/xcbeautify" "$RUNNER_TEMP/xcbeautify-cache"
          echo "$RUNNER_TEMP/xcbeautify/bin" >> "$GITHUB_PATH"

      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodegen --version
          test "$(xcbeautify --version)" = "3.2.1"

      - name: Lint source and integration files
        run: |
          xcrun swift-format lint --strict --recursive Islet IsletTests Tools
          xcrun swiftc -typecheck Tools/islet-pulse.swift
          jq empty Integrations/Pulse/providers.json Integrations/Pulse/pulse-command.schema.json
          sh -n Integrations/Pulse/examples/github-actions.sh Scripts/*.sh

      - name: Generate Xcode project
        run: |
          xcodegen generate
          resolved_dir=Islet.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$resolved_dir"
          install -m 0644 Package.resolved "$resolved_dir/Package.resolved"
          git diff --exit-code -- Islet/Info.plist

      - name: Resolve pinned packages
        run: |
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project Islet.xcodeproj \
            -scheme Islet \
            -derivedDataPath "$DERIVED_DATA" \
            -onlyUsePackageVersionsFromResolvedFile | xcbeautify
          cmp Package.resolved Islet.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Run arm64 tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Islet.xcodeproj \
            -scheme Islet \
            -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath "$DERIVED_DATA" \
            -disableAutomaticPackageResolution \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            test | xcbeautify

      - name: Verify arm64 build products
        run: |
          app="$DERIVED_DATA/Build/Products/Debug/Islet.app"
          framework="$app/Contents/Frameworks/MediaRemoteAdapter.framework/MediaRemoteAdapter"
          lipo "$app/Contents/MacOS/Islet" -verify_arch arm64
          lipo "$framework" -verify_arch arm64

      - name: Run static analysis
        run: |
          set -o pipefail
          xcodebuild \
            -project Islet.xcodeproj \
            -scheme Islet \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$DERIVED_DATA" \
            -disableAutomaticPackageResolution \
            CODE_SIGNING_ALLOWED=NO \
            analyze | xcbeautify

  test-x86_64:
    name: Build and test (x86_64)
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      DERIVED_DATA: ${{ github.workspace }}/DerivedData

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: |
          Scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Restore verified xcbeautify archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/xcbeautify-cache
          key: xcbeautify-3.2.1-universal-87fdbe786f71d7b2ee28c5c1ca97087587292f2c5c6f9e721cf02db8b2a3c241

      - name: Install xcbeautify
        run: |
          Scripts/install-xcbeautify.sh "$RUNNER_TEMP/xcbeautify" "$RUNNER_TEMP/xcbeautify-cache"
          echo "$RUNNER_TEMP/xcbeautify/bin" >> "$GITHUB_PATH"

      - name: Check Intel toolchain
        run: |
          [[ "$(uname -m)" == x86_64 ]]
          xcodebuild -version
          swift --version
          xcodegen --version
          test "$(xcbeautify --version)" = "3.2.1"

      - name: Generate Xcode project
        run: |
          xcodegen generate
          resolved_dir=Islet.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          mkdir -p "$resolved_dir"
          install -m 0644 Package.resolved "$resolved_dir/Package.resolved"
          git diff --exit-code -- Islet/Info.plist

      - name: Resolve pinned packages
        run: |
          set -o pipefail
          xcodebuild \
            -resolvePackageDependencies \
            -project Islet.xcodeproj \
            -scheme Islet \
            -derivedDataPath "$DERIVED_DATA" \
            -onlyUsePackageVersionsFromResolvedFile | xcbeautify
          cmp Package.resolved Islet.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      - name: Run x86_64 tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Islet.xcodeproj \
            -scheme Islet \
            -destination 'platform=macOS,arch=x86_64' \
            -derivedDataPath "$DERIVED_DATA" \
            -disableAutomaticPackageResolution \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual \
            test | xcbeautify

      - name: Verify x86_64 build products
        run: |
          app="$DERIVED_DATA/Build/Products/Debug/Islet.app"
          framework="$app/Contents/Frameworks/MediaRemoteAdapter.framework/MediaRemoteAdapter"
          lipo "$app/Contents/MacOS/Islet" -verify_arch x86_64
          lipo "$framework" -verify_arch x86_64
